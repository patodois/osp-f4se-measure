# Public-tree gate (tools/check_public_tree.py): this repository's additions to the built-in rules. Lists only grow here.
# Exceptions go in .public-tree-allow, each with a reason. See the header of the script for the directives.
#
# The plugin's own needs pass without exceptions: C++ and assembly source, Python tools, JSON packets, schemas and
# test fixtures, all text. What stays out: the game's files, saves, screenshots and every other image, built DLLs and
# executables (built-in compiled-binary rule), decompiled or disassembled code, local paths and secrets.

# Fallout 4 data: plugins, archives, models, textures, materials, strings, scripts, interface, sound, animation, terrain
private_ext .esm
private_ext .esp
private_ext .esl
private_ext .ba2
private_ext .bsa
private_ext .nif
private_ext .kf
private_ext .hkx
private_ext .dds
private_ext .bgsm
private_ext .bgem
private_ext .strings
private_ext .dlstrings
private_ext .ilstrings
private_ext .pex
private_ext .psc
private_ext .swf
private_ext .xwm
private_ext .fuz
private_ext .lip
private_ext .btd
private_ext .bto
private_ext .btr
private_ext .cdx

# Saves and F4SE co-saves
private_ext .fos
private_ext .f4se

# Screenshots and every other image: a result carries numbers and hashes only, never pixels
private_ext .png
private_ext .jpg
private_ext .jpeg
private_ext .bmp
private_ext .tga
private_ext .gif
private_ext .webp
private_ext .tif
private_ext .tiff
private_ext .heic
private_ext .exr
private_ext .hdr

# Crash dumps and disassembler or decompiler databases
private_ext .dmp
private_ext .mdmp
private_ext .idb
private_ext .i64
private_ext .id0
private_ext .gpr
private_ext .rep
private_ext .bndb

# A person's game configuration, load order, setting-name list, logs and run folders
private_name fallout4*.ini
private_name plugins.txt
private_name loadorder.txt
private_name osp_measure_settings.txt
private_name *.log
private_dir runs
private_dir screenshots

# Output of native decompilers and disassemblers. Automatic names carry the game's image base (0x140000000).
# A bracketed letter keeps a pattern from matching its own line here.
marker (?i)Hex-Ray[s] decompiler|generated by (?:The )?Interactive Disassemble[r]|Decompiled (?:with|by) (?:Ghidra|IDA|Binary Ninja|RetDec|snowman)
marker \b(?:FUN|DAT|LAB|PTR|thunk_FUN)_14[0-9a-f]{7}\b
marker \b(?:sub|loc|qword|dword|byte|word|off|unk|stru|xmmword)_14[0-9A-F]{7}\b
marker //\s*WARNING: (?:Could not recover jumptable|Removing unreachable block|Subroutine does not return|Globals starting with)
